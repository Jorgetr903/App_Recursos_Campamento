<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PDF Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #525659; }
    #container {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    canvas {
      display: block;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      background: white;

      max-width: 100%;
      height: auto;
    }
    #loading {
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      margin-top: 40px;
    }
    #error {
      color: #ff6b6b;
      font-family: sans-serif;
      font-size: 16px;
      margin-top: 40px;
      text-align: center;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="loading">Cargando PDF...</div>
  </div>
  <script type="module">
    import * as pdfjsLib from './pdfjs/pdf.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.mjs';

    const params = new URLSearchParams(window.location.search);
    const pdfUrl = params.get('file');
    const container = document.getElementById('container');
    const loading = document.getElementById('loading');

    if (!pdfUrl) {
      loading.innerHTML = '';
      const err = document.createElement('div');
      err.id = 'error';
      err.textContent = 'No se especificó ningún PDF.';
      container.appendChild(err);
    } else {
      pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
        loading.remove();
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const containerWidth = container.clientWidth;
            const viewport = page.getViewport({ scale: 1 });
            const scale = containerWidth / viewport.width;
            const scaledViewport = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            canvas.width = scaledViewport.width;
            canvas.height = scaledViewport.height;
          container.appendChild(canvas);
          await page.render({
            canvasContext: canvas.getContext('2d'),
            viewport: scaledViewport
          }).promise;
        }
      }).catch((err) => {
        loading.innerHTML = '';
        const errDiv = document.createElement('div');
        errDiv.id = 'error';
        errDiv.textContent = 'Error al cargar el PDF: ' + err.message;
        container.appendChild(errDiv);
      });
    }
      window.addEventListener('resize', () => {
      location.reload();
      });
  </script>
</body>
</html>
