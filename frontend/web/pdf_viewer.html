<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>PDF Viewer Profesional</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #525659; overflow: hidden; }
    #container {
      width: 100%;
      height: 100%;
      overflow: auto;
      touch-action: none;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .page-wrapper {
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      background: white;
      transform-origin: 0 0;
    }
    canvas {
      display: block;
    }
    #loading {
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      margin-top: 40px;
    }
    #error {
      color: #ff6b6b;
      font-family: sans-serif;
      font-size: 16px;
      margin-top: 40px;
      text-align: center;
      padding: 16px;
    }
  </style>
</head>
<body>
<div id="container">
  <div id="loading">Cargando PDF...</div>
</div>

<script type="module">
import * as pdfjsLib from './pdfjs/pdf.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.mjs';

const params = new URLSearchParams(window.location.search);
const pdfUrl = params.get('file');
const container = document.getElementById('container');
const loading = document.getElementById('loading');

if (!pdfUrl) {
  loading.innerHTML = '';
  const err = document.createElement('div');
  err.id = 'error';
  err.textContent = 'No se especificó ningún PDF.';
  container.appendChild(err);
} else {
  let pdfDoc = null;
  const pages = [];
  let scale = 1;

  pdfjsLib.getDocument(pdfUrl).promise.then(async pdf => {
    pdfDoc = pdf;
    loading.remove();

    const containerWidth = container.clientWidth;

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1 });
      const baseScale = containerWidth / viewport.width;
      if (i === 1) scale = baseScale * 1.2;

      const wrapper = document.createElement('div');
      wrapper.className = 'page-wrapper';
      const canvas = document.createElement('canvas');
      wrapper.appendChild(canvas);
      container.appendChild(wrapper);

      pages.push({ page, canvas, wrapper });
      renderPage(page, canvas, scale);
      wrapper.style.transform = `scale(${scale})`; // escala inicial
    }
  }).catch(err => {
    loading.innerHTML = '';
    const errDiv = document.createElement('div');
    errDiv.id = 'error';
    errDiv.textContent = 'Error al cargar el PDF: ' + err.message;
    container.appendChild(errDiv);
  });

  function renderPage(page, canvas, scale) {
    const viewport = page.getViewport({ scale });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const context = canvas.getContext('2d');
    page.render({ canvasContext: context, viewport });
  }

  // ======================
  // Zoom con scroll
  // ======================
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    scale = Math.min(Math.max(scale + delta, 0.5), 5);
    pages.forEach(p => {
      p.wrapper.style.transform = `scale(${scale})`;
    });
  });

  // ======================
  // Pinch zoom móvil
  // ======================
  let initialDistance = null;
  container.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      initialDistance = Math.hypot(dx, dy);
    }
  });

  container.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && initialDistance) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const newDistance = Math.hypot(dx, dy);
      let newScale = scale * (newDistance / initialDistance);
      newScale = Math.min(Math.max(newScale, 0.5), 5);
      pages.forEach(p => {
        p.wrapper.style.transform = `scale(${newScale})`;
      });
      e.preventDefault();
    }
  });

  container.addEventListener('touchend', e => {
    if (e.touches.length < 2) {
      initialDistance = null;
      // guardar escala actual
      const firstWrapper = pages[0]?.wrapper;
      if (firstWrapper) {
        const computed = window.getComputedStyle(firstWrapper).transform;
        const matrix = computed.match(/matrix\((.+)\)/);
        if (matrix) scale = parseFloat(matrix[1].split(',')[0]);
      }
    }
  });

  // Re-render en resize si quieres ajustar resolución
  window.addEventListener('resize', () => {
    pages.forEach(p => {
      renderPage(p.page, p.canvas, scale);
      p.wrapper.style.transform = `scale(${scale})`;
    });
  });
}
</script>
</body>
</html>
