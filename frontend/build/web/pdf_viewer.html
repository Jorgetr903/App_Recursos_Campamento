<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PDF Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #525659; overflow: hidden; }
    #container {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .page-wrapper {
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      background: white;
      line-height: 0;
    }
    canvas { display: block; }
    #loading, #error {
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      margin-top: 40px;
      text-align: center;
      padding: 16px;
    }
    #error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div id="container">
    <div id="loading">Cargando PDF...</div>
  </div>

  <script type="module">
    import * as pdfjsLib from './pdfjs/pdf.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.mjs';

    const params = new URLSearchParams(window.location.search);
    const pdfUrl = params.get('file');
    const container = document.getElementById('container');
    const loading = document.getElementById('loading');

    if (!pdfUrl) {
      loading.textContent = 'No se especificó ningún PDF.';
      loading.id = 'error';
    }else{

        // Estado global
        const pages = []; // { page, canvas, renderTask }
        let scale = 1;
        let baseScale = 1;
        let renderScheduled = false;
        let renderDebounceTimer = null;

        // ── Renderizado con cancelación ──────────────────────────
        async function renderPage(entry) {
        // Cancelar render anterior si sigue activo
        if (entry.renderTask) {
            try { entry.renderTask.cancel(); } catch (_) {}
            entry.renderTask = null;
        }

        const dpr = window.devicePixelRatio || 1;
        const viewport = entry.page.getViewport({ scale: scale * dpr });

        entry.canvas.width  = viewport.width;
        entry.canvas.height = viewport.height;
        entry.canvas.style.width  = (viewport.width  / dpr) + 'px';
        entry.canvas.style.height = (viewport.height / dpr) + 'px';
        entry.wrapper.style.width  = (viewport.width  / dpr) + 'px';
        entry.wrapper.style.height = (viewport.height / dpr) + 'px';

        const ctx = entry.canvas.getContext('2d');
        ctx.clearRect(0, 0, entry.canvas.width, entry.canvas.height);

        const task = entry.page.render({ canvasContext: ctx, viewport });
        entry.renderTask = task;

        try {
            await task.promise;
        } catch (e) {
            if (e?.name !== 'RenderingCancelledException') {
            console.error('Error renderizando página:', e);
            }
        } finally {
            if (entry.renderTask === task) entry.renderTask = null;
        }
        }

        function scheduleRender() {
        clearTimeout(renderDebounceTimer);
        renderDebounceTimer = setTimeout(() => {
            pages.forEach(renderPage);
        }, 50);
        }

        // ── Carga del PDF ────────────────────────────────────────
        try {
        const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
        loading.remove();

        const containerWidth = container.clientWidth - 32; // padding

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const viewport1 = page.getViewport({ scale: 1 });
            if (i === 1) {
            baseScale = containerWidth / viewport1.width;
            scale = baseScale;
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'page-wrapper';
            const canvas = document.createElement('canvas');
            wrapper.appendChild(canvas);
            container.appendChild(wrapper);

            const entry = { page, canvas, wrapper, renderTask: null };
            pages.push(entry);
            await renderPage(entry);
        }
        } catch (e) {
        loading.textContent = 'Error al cargar el PDF: ' + e.message;
        loading.id = 'error';
        }

        // ── Zoom helper ──────────────────────────────────────────
        function applyZoom(factor, focalX, focalY) {
            const newScale = Math.min(Math.max(scale * factor, baseScale * 0.5), baseScale * 8);
            if (Math.abs(newScale - scale) < 0.001) return;

            const rect = container.getBoundingClientRect();
            
            // Posición del punto focal relativa al contenido (no al viewport)
            const contentX = container.scrollLeft + (focalX - rect.left);
            const contentY = container.scrollTop + (focalY - rect.top);
            
            const zoomRatio = newScale / scale;
            scale = newScale;
            
            scheduleRender();

            // Ajustar scroll para mantener el punto focal estático
            container.scrollLeft = contentX * zoomRatio - (focalX - rect.left);
            container.scrollTop = contentY * zoomRatio - (focalY - rect.top);
        }

        // ── Zoom con rueda de ratón ──────────────────────────────
        container.addEventListener('wheel', e => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.12 : 0.89;
        applyZoom(factor, e.clientX, e.clientY);
        }, { passive: false });

        // ── Pinch-to-zoom en móvil ───────────────────────────────
        let lastDistance = null;
        let lastPinchCenter = null;

        container.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
            const [t0, t1] = e.touches;
            lastDistance = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
            lastPinchCenter = {
            x: (t0.clientX + t1.clientX) / 2,
            y: (t0.clientY + t1.clientY) / 2
            };
            e.preventDefault();
        }
        }, { passive: false });

        container.addEventListener('touchmove', e => {
        if (e.touches.length !== 2 || !lastDistance) return;
        e.preventDefault();

        const [t0, t1] = e.touches;
        const newDistance = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
        const center = {
            x: (t0.clientX + t1.clientX) / 2,
            y: (t0.clientY + t1.clientY) / 2
        };

        const factor = newDistance / lastDistance;
        applyZoom(factor, center.x, center.y);

        lastDistance = newDistance;
        lastPinchCenter = center;
        }, { passive: false });

        container.addEventListener('touchend', e => {
        if (e.touches.length < 2) {
            lastDistance = null;
            lastPinchCenter = null;
        }
        });

        // ── Re-render en resize ──────────────────────────────────
        const resizeObserver = new ResizeObserver(() => {
        scheduleRender();
        });
        resizeObserver.observe(container);
    }
  </script>
</body>
</html>
