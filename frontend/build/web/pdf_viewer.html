<script type="module">
import * as pdfjsLib from './pdfjs/pdf.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.mjs';

const params = new URLSearchParams(window.location.search);
const pdfUrl = params.get('file');
const container = document.getElementById('container');
const loading = document.getElementById('loading');

if (!pdfUrl) {
  loading.innerHTML = '';
  const err = document.createElement('div');
  err.id = 'error';
  err.textContent = 'No se especificó ningún PDF.';
  container.appendChild(err);
} else {
  let pdfDoc = null;
  const pages = [];
  let scale = 1;
  let pendingZoom = false;

  pdfjsLib.getDocument(pdfUrl).promise.then(async pdf => {
    pdfDoc = pdf;
    loading.remove();
    const containerWidth = container.clientWidth;

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1 });
      const baseScale = containerWidth / viewport.width;
      if (i === 1) scale = baseScale * 1;

      const wrapper = document.createElement('div');
      wrapper.className = 'page-wrapper';
      const canvas = document.createElement('canvas');
      wrapper.appendChild(canvas);
      container.appendChild(wrapper);

      pages.push({ page, canvas, wrapper });
      renderPage(page, canvas, scale);
    }
  }).catch(err => {
    loading.innerHTML = '';
    const errDiv = document.createElement('div');
    errDiv.id = 'error';
    errDiv.textContent = 'Error al cargar PDF: ' + err.message;
    container.appendChild(errDiv);
  });

  function renderPage(page, canvas, scale) {
    const viewport = page.getViewport({ scale });
    const ratio = window.devicePixelRatio || 1;

    canvas.width = viewport.width * ratio;
    canvas.height = viewport.height * ratio;
    canvas.style.width = viewport.width + 'px';
    canvas.style.height = viewport.height + 'px';

    const ctx = canvas.getContext('2d');
    page.render({
      canvasContext: ctx,
      viewport: page.getViewport({ scale: scale * ratio })
    });
  }

  // =========================
  // Zoom centrado en punto
  // =========================
  function zoomAt(factor, clientX, clientY) {
    const rect = container.getBoundingClientRect();
    const offsetX = clientX - rect.left + container.scrollLeft;
    const offsetY = clientY - rect.top + container.scrollTop;

    const newScale = Math.min(Math.max(scale * factor, 0.5), 5);
    const zoomFactor = newScale / scale;
    scale = newScale;

    if (!pendingZoom) {
      pendingZoom = true;
      requestAnimationFrame(() => {
        pages.forEach(p => renderPage(p.page, p.canvas, scale));
        pendingZoom = false;
      });
    }

    container.scrollLeft = offsetX * zoomFactor - (clientX - rect.left);
    container.scrollTop = offsetY * zoomFactor - (clientY - rect.top);
  }

  // =========================
  // Zoom con scroll de mouse
  // =========================
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.9 : 1.1;
    zoomAt(factor, e.clientX, e.clientY);
  }, { passive: false });

  // =========================
  // Pinch-to-zoom en móvil
  // =========================
  let initialDistance = null;
  let pinchCenter = { x: 0, y: 0 };

  container.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      initialDistance = Math.hypot(dx, dy);
      pinchCenter = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
      };
    }
  });

  container.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && initialDistance) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const newDistance = Math.hypot(dx, dy);
      const factor = newDistance / initialDistance;
      zoomAt(factor, pinchCenter.x, pinchCenter.y);
      initialDistance = newDistance;
      e.preventDefault();
    }
  }, { passive: false });

  container.addEventListener('touchend', e => {
    if (e.touches.length < 2) initialDistance = null;
  });

  // =========================
  // Re-render en resize
  // =========================
  window.addEventListener('resize', () => {
    pages.forEach(p => renderPage(p.page, p.canvas, scale));
  });
}
</script>
