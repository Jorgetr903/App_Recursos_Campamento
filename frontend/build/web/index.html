<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CSP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>CSP</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function openPdfUrl(url) {
      var a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function downloadPdfUrl(url, filename) {
      async function fetchBlob(downloadUrl) {
        const response = await fetch(downloadUrl, { mode: 'cors' });
        if (!response.ok) {
          throw new Error('Download failed with status ' + response.status);
        }
        return await response.blob();
      }

      function triggerDownload(href) {
        var a = document.createElement('a');
        a.href = href;
        a.download = filename || 'archivo.pdf';
        a.rel = 'noopener noreferrer';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      try {
        let blob;
        try {
          blob = await fetchBlob(url);
        } catch (error) {
          if (!url.endsWith('/download')) throw error;
          blob = await fetchBlob(url.slice(0, -'/download'.length));
        }

        const blobUrl = URL.createObjectURL(blob);
        triggerDownload(blobUrl);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
        return;
      } catch (error) {
        console.warn('Falling back to browser download link:', error);
      }

      var a = document.createElement('a');
      a.href = url;
      a.download = filename || 'archivo.pdf';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
